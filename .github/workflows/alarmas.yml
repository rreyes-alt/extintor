name: Alarmas de extintores

on:
  schedule:
    - cron: "7 11 * * *"   # todos los días 08:07 hora Argentina (11:07 UTC)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  alarmas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save nodemailer@6
      - run: node scripts/alarmas.mjs
        env:
          SUPABASE_URL: https://eiimvonuwdaahmumbjkl.supabase.co
          APP_URL: https://rreyes-alt.github.io/extintor/
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
